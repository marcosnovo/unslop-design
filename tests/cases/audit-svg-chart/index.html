<!doctype html><meta name="viewport" content="width=device-width">
<style>body{margin:0;padding:16px;background:#fff;color:#111;font:16px/1.5 system-ui}svg{width:100%;height:auto;display:block}</style>
<h1>Revenue</h1>
<!-- 800 units wide, drawn at ~358 px on a phone: 12-unit labels land near 5 px. -->
<svg viewBox="0 0 800 300" role="img" aria-label="Revenue by month">
  <line x1="40" y1="260" x2="780" y2="260" stroke="#888"/>
  <text x="40" y="285" font-size="12" fill="#111">Jan</text>
  <text x="400" y="285" font-size="12" fill="#111">Apr</text>
  <!-- color says dark, fill paints pale: the fill is what you see -->
  <text x="700" y="285" font-size="12" fill="#ccc" style="color:#111">Jun</text>
</svg>
