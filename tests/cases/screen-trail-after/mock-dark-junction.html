<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,system-ui,sans-serif;background:var(--canvas);color:var(--ink);height:100vh;overflow:hidden;font-variant-numeric:tabular-nums}
.map{position:fixed;inset:0;width:100%;height:100%}
.menu{position:fixed;top:calc(env(safe-area-inset-top) + var(--s4));right:var(--s4);display:flex;gap:var(--s2)}
.menu button{width:48px;height:48px;border:0;border-radius:var(--r-pill);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.menu svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.name{position:fixed;top:calc(env(safe-area-inset-top) + var(--s4));left:var(--s4);background:var(--surface);border-radius:var(--r-pill);padding:var(--s3) var(--s4);font-size:14px}
.sheet{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(env(safe-area-inset-bottom) + var(--s4));background:var(--surface);border-radius:var(--r-sheet);padding:var(--s4);display:grid;grid-template-columns:28px 1fr;gap:var(--s4);align-items:start}
.blaze{width:28px;height:44px}
.answer{font-size:22px;font-weight:600;line-height:1.2}
.meta{font-size:14px;color:var(--muted);margin-top:var(--s1);line-height:1.4}
</style></head><body>
