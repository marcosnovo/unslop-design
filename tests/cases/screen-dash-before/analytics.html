<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Analytics</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0f0e1a;color:#e8e6f5}
.side{position:fixed;top:0;bottom:0;left:0;width:220px;background:#16142a;padding:20px}.side a{display:block;color:#9a96c2;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14px}.side a.on{background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff}
main{margin-left:220px;padding:28px}
h1{font-size:28px;margin:0 0 4px}.sub{color:#8a86b0;margin:0 0 24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#1b1933;border:1px solid #2c2950;border-radius:16px;padding:18px}.kpi .l{font-size:13px;color:#8a86b0}.kpi .v{font-size:28px;font-weight:800;margin:6px 0}.kpi .d{font-size:13px;color:#22c55e}
.chart{background:#1b1933;border:1px solid #2c2950;border-radius:16px;padding:20px}
.chart h2{font-size:16px;margin:0 0 12px}
.legend{display:flex;gap:14px;font-size:12px;color:#8a86b0;margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head><body>
<nav class="side"><a class="on" href="#">📊 Dashboard</a><a href="#">👥 Users</a><a href="#">💰 Revenue</a><a href="#">⚙️ Settings</a></nav>
<main>
