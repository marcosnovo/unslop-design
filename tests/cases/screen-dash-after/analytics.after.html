<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics</title>
<style>
:root{
  color-scheme:dark;
  /* spacing 4 / 8 / 12 / 16 / 24 / 32 / 48 */
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.5rem;--s6:2rem;--s7:3rem;
  /* type 12 / 14 / 16 / 24 / 40, weights 400 + 600 */
  --t-xs:.75rem;--t-sm:.875rem;--t-md:1rem;--t-lg:1.5rem;--t-xl:2.5rem;
  --w-regular:400;--w-strong:600;
  /* cool gray, one accent, roles */
  --canvas:#0e1116;--surface:#151a21;--raised:#1c222b;--line:#232a34;
  --ink:#e6e9ee;--ink-2:#a3adba;--ink-3:#8793a1;
  --accent:#8ab8ff;--accent-soft:#6f8fba;
  --good:#4ade80;--worse:#f5b04c;
  --r-row:8px;--r-panel:12px;
  --rail:var(--s6);
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--canvas);color:var(--ink);
  font:var(--w-regular) var(--t-sm)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
::selection{background:var(--accent);color:var(--canvas)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:15rem minmax(0,1fr);min-height:100vh}
.plot{overflow-x:auto}
.side{padding:var(--s5) var(--s3);background:var(--surface)}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s1)}
.side a{display:grid;grid-template-columns:1.25rem 1fr;gap:var(--s3);align-items:center;
  padding:var(--s2) var(--s3);border-radius:var(--r-row);color:var(--ink-2);text-decoration:none;
  transition:background-color .15s,color .15s}
.side a:hover{background:var(--raised);color:var(--ink)}
.side a[aria-current="page"]{background:var(--raised);color:var(--ink);font-weight:var(--w-strong)}
.side svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

main{padding:var(--s6) var(--rail);max-width:72rem}
h1{font-size:var(--t-lg);line-height:1.2;font-weight:var(--w-strong);margin:0 0 var(--s6)}

/* one hero number, three that step back; no cards */
.kpis{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:var(--s6);align-items:end;margin-bottom:var(--s7)}
.label{font-size:var(--t-sm);color:var(--ink-2);margin:0}
.value{margin:var(--s1) 0;font-weight:var(--w-strong);line-height:1.1;font-variant-numeric:tabular-nums}
.hero .value{font-size:var(--t-xl)}
.stat .value{font-size:var(--t-lg)}
.delta{margin:0;font-size:var(--t-xs);color:var(--ink-2);font-variant-numeric:tabular-nums}
.delta b{font-weight:var(--w-strong)}
.delta .good{color:var(--good)}.delta .worse{color:var(--worse)}

.chart{background:var(--surface);border-radius:var(--r-panel);padding:var(--s5)}
.chart header{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);margin-bottom:var(--s4);flex-wrap:wrap}
.chart h2{margin:0;font-size:var(--t-md);font-weight:var(--w-strong)}
.chart .range{color:var(--ink-3);font-size:var(--t-xs)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:var(--w-regular) 11px system-ui,sans-serif;fill:var(--ink-3)}
.chart .tick{font-variant-numeric:tabular-nums}
.chart .name{font-size:12px;font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart path{fill:none}
.s-rev{stroke:var(--accent);stroke-width:3}.s-profit{stroke:var(--accent-soft);stroke-width:2}.s-exp{stroke:var(--ink-3);stroke-width:2;stroke-dasharray:6 4}
.dot-rev{fill:var(--accent)}
.chart text.n-rev{fill:var(--accent)}.chart text.n-exp{fill:var(--ink-3)}.chart text.n-profit{fill:var(--accent-soft)}

@media (max-width:64rem){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-column:1/-1}}
@media (max-width:48rem){
  :root{--rail:var(--s4)}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{padding:var(--s2) var(--s3)}
  .side ul{display:flex;flex-wrap:wrap;gap:var(--s1)}
  .plot svg{min-width:34rem}
  .side a{grid-template-columns:1.25rem auto;white-space:nowrap}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5)}
  .chart{padding:var(--s4)}
}
@media (prefers-reduced-motion:reduce){.side a{transition:none}}
</style>
</head>
<body>
<div class="app">
<nav class="side" aria-label="Main">
<ul>
<li><a href="#" aria-current="page"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg>Dashboard</a></li>
<li><a href="#"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="7" r="3"/><path d="M2.5 16c.5-3 2.7-4.5 5.5-4.5s5 1.5 5.5 4.500"/><path d="M13 4.2a3 3 0 0 1 0 5.6M15 11.8c1.5.6 2.300 2 2.500 4.2"/></svg>Users</a></li>
<li><a href="#"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M12.2 7.5c-.4-.9-1.200-1.300-2.200-1.300-1.200 0-2.100.6-2.100 1.600 0 2.300 4.4 1 4.4 3.4 0 1-1 1.700-2.300 1.700-1.100 0-2-.5-2.4-1.4M10 4.800v1.4M10 13.800v1.4"/></svg>Revenue</a></li>
<li><a href="#"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg>Settings</a></li>
</ul>
</nav>
<main>
<h1>Analytics</h1>
<section class="kpis" aria-label="Key figures">
<div class="hero"><p class="label">Revenue</p><p class="value">$48,295</p><p class="delta"><b class="good">Up 12.5%</b> vs previous period</p></div>
<div class="stat"><p class="label">Active users</p><p class="value">2,847</p><p class="delta"><b class="good">Up 8.2%</b></p></div>
<div class="stat"><p class="label">Conversion</p><p class="value">3.24%</p><p class="delta"><b class="good">Up 2.1%</b></p></div>
<div class="stat"><p class="label">Churn</p><p class="value">1.8%</p><p class="delta"><b class="worse">Up 0.4%, worse</b></p></div>
</section>

<section class="chart">
<header><h2>Revenue, expenses and profit</h2><span class="range">Jan to Jun</span></header>
<div class="plot"><svg viewBox="0 0 800 260" role="img" aria-label="Line chart, January to June. Revenue rises from about 24k to 49k. Expenses rise from about 16k to 26k. Profit rises from about 14k to 24k.">
<g class="grid">
<line x1="40" y1="20" x2="790" y2="20"/><line x1="40" y1="120" x2="790" y2="120"/><line x1="40" y1="220" x2="790" y2="220"/></g>
<g class="tick"><text x="0" y="24">50k</text><text x="0" y="124">30k</text><text x="0" y="224">10k</text>
<text x="100" y="246" text-anchor="middle">Jan</text><text x="220" y="246" text-anchor="middle">Feb</text><text x="340" y="246" text-anchor="middle">Mar</text><text x="460" y="246" text-anchor="middle">Apr</text><text x="580" y="246" text-anchor="middle">May</text><text x="700" y="246" text-anchor="middle">Jun</text></g>
<path d="M100 190 C160 185 200 180 220 175 S300 170 340 168 S420 160 460 165 S540 150 580 155 S660 145 700 140" class="s-exp"/>
<path d="M100 200 C160 195 200 190 220 192 S300 180 340 185 S420 170 460 175 S540 165 580 160 S660 150 700 150" class="s-profit"/>
<path d="M100 150 C160 130 180 160 220 120 S300 90 340 110 S420 60 460 80 S540 40 580 50 S660 30 700 25" class="s-rev"/>
<circle class="dot-rev" cx="700" cy="25" r="4"/>
<text class="name n-rev" x="712" y="29">Revenue</text>
<text class="name n-exp" x="712" y="138">Expenses</text>
<text class="name n-profit" x="712" y="158">Profit</text>
</svg></div>
</section>
</main>
</div>
</body>
</html>
