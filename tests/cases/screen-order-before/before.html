<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Order status before</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#FFF6EE;font-family:-apple-system,"Inter",system-ui,sans-serif;color:#222;min-height:100vh;padding:14px 18px}
.hi{color:#AA9999;font-size:17px}
h1{font-size:28px;font-weight:700;margin:2px 0 24px}
.hero{background:linear-gradient(135deg,#FF7323,#FF4271);border-radius:28px;padding:28px 24px;color:#fff;box-shadow:0 12px 32px rgba(255,80,80,.3)}
.hero small{font-size:17px;letter-spacing:.5px;display:block;opacity:.85}
.hero b{font-size:56px;display:block;line-height:1.1}
.hero p{font-size:17px;opacity:.85;margin-top:8px}
.steps{display:flex;justify-content:space-between;margin:24px 0;text-align:center;font-size:14px;color:#AA9999}
.steps i{display:block;font-style:normal;font-size:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 4px 14px rgba(0,0,0,.06);color:#B8A9A9;font-size:15px}
.c b{display:block;color:#222;font-size:22px;margin-top:4px}
.btn{margin-top:18px;background:linear-gradient(90deg,#FF7323,#FF4271);color:#fff;text-align:center;font-weight:700;font-size:20px;padding:18px;border-radius:20px}
</style></head><body>
<div class="hi">Hey Sam! Your food is on the way 🛵</div><h1>Order Status Tracking</h1>
<div class="hero"><small>ARRIVING IN</small><b>12 min</b><p>Your order is being prepared with love ❤️</p></div>
<div class="steps"><div><i>✅</i>Placed</div><div><i>👨‍🍳</i>Cooking</div><div><i>🛵</i>On the way</div><div><i>🏠</i>Delivered</div></div>
<div class="grid"><div class="c">Order Total<b>$24.80</b></div><div class="c">Items<b>3</b></div><div class="c">Distance<b>2.4 km</b></div><div class="c">Rating<b>4.9 ⭐</b></div></div>
<div class="btn">📞 Contact Rider Now!</div>
</body></html>
