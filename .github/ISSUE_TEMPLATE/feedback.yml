name: Feedback on a run
description: The skill did something wrong or unhelpful
labels: ["feedback"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked, what the skill did, and what you expected.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [SwiftUI, Jetpack Compose, Web, Other]
  - type: input
    id: fix
    attributes:
      label: Fix number involved (if any)
      placeholder: "#20"
