name: release
# On every push to main: if the version in .claude-plugin/plugin.json has no
# tag yet, tag that commit, publish a GitHub release with the CHANGELOG entry
# and unslop-design.zip (for claude.ai, Claude desktop and ChatGPT), and
# publish to npm when an NPM_TOKEN secret is set. Bump the version to release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          v=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged: nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: python3 scripts/validate.py && python3 scripts/test.py
      - if: steps.version.outputs.new == 'true'
        name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              raise SystemExit(f"CHANGELOG.md has no '## {v}' entry")
          open("notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - if: steps.version.outputs.new == 'true'
        name: Skill zip for chat apps
        run: |
          mkdir -p dist/unslop-design
          cp SKILL.md checklist.md context.md critique.md platforms.md process.md references.md spec-card.md web.md LICENSE dist/unslop-design/
          cp -R scripts agents examples dist/unslop-design/
          rm -f dist/unslop-design/scripts/test.py
          (cd dist && zip -qr unslop-design.zip unslop-design)
      - if: steps.version.outputs.new == 'true'
        name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/unslop-design.zip \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - if: steps.version.outputs.new == 'true'
        name: Publish to npm (only with an NPM_TOKEN secret)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice title=npm::No NPM_TOKEN secret: skipped. Add one in Settings → Secrets → Actions to publish npx unslop-design."
            exit 0
          fi
          npm publish --provenance --access public
