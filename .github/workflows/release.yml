name: release
# On every push to main: if the version in .claude-plugin/plugin.json has no
# tag yet, tag that commit, publish a GitHub release with the CHANGELOG entry
# and unslop-design.zip (for claude.ai, Claude desktop and ChatGPT). Separately,
# publish to npm (Trusted Publishing, or an NPM_TOKEN secret) when npm lacks the version.
# Bump the version to release; run it by hand to retry npm.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          v=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged: nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: python3 scripts/validate.py && python3 scripts/test.py
      - if: steps.version.outputs.new == 'true'
        name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(v)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              raise SystemExit(f"CHANGELOG.md has no '## {v}' entry")
          open("notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - if: steps.version.outputs.new == 'true'
        name: Skill zip for chat apps
        run: |
          mkdir -p dist/unslop-design
          cp SKILL.md checklist.md context.md critique.md platforms.md process.md references.md spec-card.md web.md LICENSE dist/unslop-design/
          cp -R scripts agents examples dist/unslop-design/
          rm -f dist/unslop-design/scripts/test.py
          (cd dist && zip -qr unslop-design.zip unslop-design)
      - if: steps.version.outputs.new == 'true'
        name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/unslop-design.zip \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
      # npm is tracked on its own: a version already tagged (a failed publish, or npm
      # set up after the release) is published on the next run if npm lacks it.
      # Trusted Publishing (OIDC, no secret) is the default; an NPM_TOKEN secret is
      # the fallback for a package that has no trusted publisher yet.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish to npm if npm lacks this version
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(npm view "unslop-design@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "unslop-design@$VERSION is already on npm"
            exit 0
          fi
          python3 scripts/validate.py
          npm install -g npm@11 --no-fund --no-audit   # trusted publishing needs npm 11.5.1+
          if [ -n "$NPM_TOKEN" ]; then
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --provenance --access public
          elif ! NODE_AUTH_TOKEN="" npm publish --provenance --access public; then
            echo "::warning title=npm::Not published. Set up Trusted Publishing on npmjs.com (package Settings, GitHub Actions, repo marcosnovo/unslop-design, workflow release.yml) or add an NPM_TOKEN secret, then run this workflow again."
          fi
