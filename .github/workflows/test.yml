name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - run: python3 scripts/test.py
      - name: The action scores its own example
        uses: ./
        with:
          paths: examples/dashboard-after.html
          min: "90"
