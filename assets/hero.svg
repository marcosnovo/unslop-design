<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B2BE0"/>
      <stop offset="1" stop-color="#C13CC9"/>
    </linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6F23A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="gbtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#FF2D87"/>
    </linearGradient>
    <filter id="heavy" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2B0A5E" flood-opacity="0.55"/>
    </filter>
    <filter id="phone" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cb"><rect x="160" y="50" width="280" height="560" rx="38"/></clipPath>
    <clipPath id="ca"><rect x="760" y="50" width="280" height="560" rx="38"/></clipPath>
  </defs>

  <rect width="1200" height="640" fill="#FBFAF8"/>

  <text x="300" y="28" font-size="14" font-weight="600" fill="#8A8A8F" text-anchor="middle" letter-spacing="1.5">BEFORE</text>
  <text x="900" y="28" font-size="14" font-weight="600" fill="#8A8A8F" text-anchor="middle" letter-spacing="1.5">AFTER</text>

  <!-- BEFORE -->
  <rect x="150" y="40" width="300" height="580" rx="48" fill="#0E0E10" filter="url(#phone)"/>
  <g clip-path="url(#cb)">
    <rect x="160" y="50" width="280" height="560" fill="url(#gb)"/>
    <text x="182" y="74" font-size="12" font-weight="600" fill="#fff">9:41</text>
    <rect x="255" y="58" width="90" height="24" rx="12" fill="#000"/>
    <text x="180" y="120" font-size="22" font-weight="800" fill="#fff">Hey there! 👋</text>
    <text x="180" y="142" font-size="12" fill="#fff" fill-opacity="0.72">Ready To Save On Fuel Today?</text>

    <rect x="176" y="160" width="248" height="130" rx="20" fill="url(#gc)" filter="url(#heavy)"/>
    <text x="192" y="186" font-size="12" font-weight="700" fill="#fff">⛽ Cheapest Near You</text>
    <rect x="326" y="212" width="86" height="24" rx="12" fill="#FF2D87"/>
    <text x="369" y="228" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">🔥 HOT DEAL</text>
    <text x="192" y="240" font-size="44" font-weight="800" fill="#fff">$3.29</text>
    <text x="192" y="272" font-size="12" font-weight="600" fill="#fff">Save up to $5 today! ✨</text>

    <rect x="176" y="306" width="118" height="92" rx="18" fill="#FF8A3D" filter="url(#heavy)"/>
    <circle cx="202" cy="332" r="14" fill="#fff" fill-opacity="0.3"/>
    <text x="202" y="337" font-size="13" text-anchor="middle">📈</text>
    <text x="192" y="366" font-size="11" font-weight="600" fill="#fff">Avg Price</text>
    <text x="192" y="387" font-size="18" font-weight="800" fill="#fff">$3.41</text>
    <rect x="306" y="306" width="118" height="92" rx="18" fill="#3B82F6" filter="url(#heavy)"/>
    <circle cx="332" cy="332" r="14" fill="#fff" fill-opacity="0.3"/>
    <text x="332" y="337" font-size="13" text-anchor="middle">📍</text>
    <text x="322" y="366" font-size="11" font-weight="600" fill="#fff">Stations</text>
    <text x="322" y="387" font-size="18" font-weight="800" fill="#fff">24</text>

    <rect x="176" y="414" width="248" height="56" rx="16" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.7" stroke-dasharray="5 4"/>
    <text x="192" y="447" font-size="12" font-weight="600" fill="#fff">💡 Pro Tip: Fill Up On Tuesdays!</text>

    <rect x="176" y="488" width="248" height="50" rx="25" fill="url(#gbtn)" filter="url(#heavy)"/>
    <text x="300" y="519" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Let's Go! 🚀</text>

    <text x="300" y="586" font-size="18" text-anchor="middle" letter-spacing="26">🏠⛽❤️👤</text>
  </g>

  <!-- AFTER -->
  <rect x="750" y="40" width="300" height="580" rx="48" fill="#0E0E10" filter="url(#phone)"/>
  <g clip-path="url(#ca)" style="font-variant-numeric: tabular-nums">
    <rect x="760" y="50" width="280" height="560" fill="#F4F4F1"/>
    <text x="782" y="74" font-size="12" font-weight="600" fill="#111">9:41</text>
    <rect x="855" y="58" width="90" height="24" rx="12" fill="#000"/>
    <text x="780" y="106" font-size="10.5" font-weight="600" fill="#6B6B70" letter-spacing="1.2">TUE, NOV 3</text>
    <text x="780" y="134" font-size="26" font-weight="700" fill="#111">Nearby</text>

    <rect x="776" y="152" width="248" height="150" rx="20" fill="#fff"/>
    <text x="792" y="178" font-size="11.5" fill="#6B6B70">Regular · cheapest within 2 mi</text>
    <text x="792" y="230" fill="#111"><tspan font-size="22" font-weight="600">$</tspan><tspan font-size="46" font-weight="700" dx="1">3.29</tspan><tspan font-size="15" font-weight="500" fill="#6B6B70" dx="4">/gal</tspan></text>
    <text x="792" y="254" font-size="12" font-weight="600" fill="#1E7B4F">↓ 12¢ below area average</text>
    <polyline points="792,286 822,282 852,288 882,279 912,283 942,276 972,281 1002,272" fill="none" stroke="#C9C9CE" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1002" cy="272" r="4" fill="#111"/>

    <rect x="776" y="316" width="248" height="156" rx="20" fill="#fff"/>
    <text x="792" y="342" font-size="14" font-weight="600" fill="#111">Shell</text>
    <text x="792" y="359" font-size="11" fill="#6B6B70">Main St · 0.7 mi</text>
    <text x="1008" y="342" font-size="15" font-weight="600" fill="#111" text-anchor="end">$3.29</text>
    <rect x="950" y="349" width="58" height="18" rx="9" fill="#E3F3EA"/>
    <text x="979" y="362" font-size="10" font-weight="600" fill="#1E6B45" text-anchor="middle">Cheapest</text>
    <line x1="792" y1="372" x2="1008" y2="372" stroke="#EEEEF0"/>
    <text x="792" y="394" font-size="14" font-weight="600" fill="#111">Costco</text>
    <text x="792" y="411" font-size="11" fill="#6B6B70">Oak Ave · 1.4 mi</text>
    <text x="1008" y="394" font-size="15" font-weight="600" fill="#111" text-anchor="end">$3.31</text>
    <line x1="792" y1="422" x2="1008" y2="422" stroke="#EEEEF0"/>
    <text x="792" y="444" font-size="14" font-weight="600" fill="#111">Chevron</text>
    <text x="792" y="461" font-size="11" fill="#6B6B70">5th St · 1.9 mi</text>
    <text x="1008" y="444" font-size="15" font-weight="600" fill="#111" text-anchor="end">$3.45</text>

    <rect x="776" y="488" width="248" height="50" rx="25" fill="#111"/>
    <text x="900" y="518" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Go to Shell · 0.7 mi</text>

    <g fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M816 590 v-9 l9 -7 l9 7 v9 z" stroke="#111"/>
      <path d="M876 574 a6 6 0 0 1 12 0 c0 5 -6 11 -6 11 s-6 -6 -6 -11 z" stroke="#9A9AA0"/>
      <path d="M936 588 c-7 -5 -10 -8 -10 -12 a4.5 4.5 0 0 1 10 -2 a4.5 4.5 0 0 1 10 2 c0 4 -3 7 -10 12 z" stroke="#9A9AA0"/>
      <circle cx="984" cy="576" r="4.5" stroke="#9A9AA0"/>
      <path d="M975 591 a9 7 0 0 1 18 0" stroke="#9A9AA0"/>
    </g>
  </g>

  <!-- middle -->
  <g>
    <rect x="514" y="206" width="172" height="36" rx="18" fill="#111"/>
    <text x="600" y="229" font-size="14" font-weight="600" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/unslop-design</text>
    <path d="M486 270 H704" stroke="#111" stroke-width="2" stroke-linecap="round"/>
    <path d="M696 262 L706 270 L696 278" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="12.5" fill="#111">
      <text x="486" y="314"><tspan fill="#9A9AA0" font-family="ui-monospace, Menlo, monospace">#26</tspan><tspan dx="8">Title, not a greeting</tspan></text>
      <text x="486" y="342"><tspan fill="#9A9AA0" font-family="ui-monospace, Menlo, monospace">#19</tspan><tspan dx="8">One accent, no gradients</tspan></text>
      <text x="486" y="370"><tspan fill="#9A9AA0" font-family="ui-monospace, Menlo, monospace">#20</tspan><tspan dx="8">Quiet badges</tspan></text>
      <text x="486" y="398"><tspan fill="#9A9AA0" font-family="ui-monospace, Menlo, monospace">#15</tspan><tspan dx="8">Number and unit on one baseline</tspan></text>
      <text x="486" y="426"><tspan fill="#9A9AA0" font-family="ui-monospace, Menlo, monospace">#16</tspan><tspan dx="8">No invented numbers</tspan></text>
      <text x="486" y="454"><tspan fill="#9A9AA0" font-family="ui-monospace, Menlo, monospace">#33</tspan><tspan dx="8">No emoji as icons</tspan></text>
      <text x="486" y="482"><tspan fill="#9A9AA0" font-family="ui-monospace, Menlo, monospace">#41</tspan><tspan dx="8">Button names its destination</tspan></text>
    </g>
    <text x="486" y="520" font-size="12" fill="#9A9AA0">+ 35 more, one at a time</text>
  </g>
</svg>
